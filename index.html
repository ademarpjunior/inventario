<style>

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.42 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

.nav .n{margin-left:auto;color:var(--muted);font-size:13px;font-weight:500}

.cuprow{display:flex;gap:8px;align-items:center}.cuprow input{flex:1;min-width:0;background:var(--fill);border:0;border-radius:10px;padding:9px 12px;min-height:40px;font-size:16px}
.cupnote{display:flex;justify-content:space-between;gap:10px;margin-top:6px;color:var(--muted);font-size:13px}

.collapse{color:var(--muted)}
.top{display:none;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);padding:4px 12px;position:sticky;top:0;z-index:20}

}

.lv.l3col{grid-template-columns:repeat(3,1fr)}

.rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:2px}
.compacto{display:flex;align-items:center;gap:11px}
.des-links{margin-top:8px}.des-link{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:.5px solid var(--line)}.des-link a{flex:1;min-width:0;color:var(--tint);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mais-link{margin-top:8px}.flink{margin-top:10px}
.pri{font-size:11.5px;font-weight:600;border-radius:5px;padding:0 6px;margin-left:5px}.pri.alta{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}.pri.baixa{color:var(--muted);background:var(--fill)}

.tag.empty{padding:14px 16px}
#dlinks{display:grid;gap:12px}.dlrow+.dlrow{border-top:.5px solid var(--line);padding-top:12px}.dlrow>.x{justify-self:end;margin-bottom:-8px}

</style>

<div class="app" id="app">

<script>
// Liga a interface à API do Apps Script. Substitui o google.script.run da versão antiga.
(function () {
  const API = 'https://script.google.com/macros/s/AKfycbxuOOH2llXQAv5kPuWJnRAFDpv9PscKJdfYfMJ8fQyQ-XdkJK2epShNCS_-TP5ea4UV/exec';
  const KEY = 'inventario-chave';
  const leChave = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };

  function portao(msg) {
    if (document.getElementById('gate')) return;
    const g = document.createElement('div');
    g.id = 'gate';
    g.innerHTML = '<div class="gate-box"><div class="gate-ico"><img src="icon-192.png" alt=""></div><h1>Inventário</h1><p>' + (msg || 'Cole sua chave de acesso para entrar.') + '</p><input id="gate-k" type="password" autocomplete="off" placeholder="Chave de acesso" aria-label="Chave de acesso"><button id="gate-ok">Entrar</button></div>';
    document.body.appendChild(g);
    document.getElementById('gate-ok').onclick = () => {
      const v = document.getElementById('gate-k').value.trim();
      if (!v) return;
      try { localStorage.setItem(KEY, v); } catch (e) { /* sem armazenamento */ }
      location.reload();
    };
  }

  function chama(fn, args, ok, bad) {
    const k = leChave();
    if (!k) { portao(); return; }
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k, fn, args }), redirect: 'follow' })
      .then((r) => r.json())
      .then((j) => {
        if (j.ok) { ok(j.data); return; }
        if (j.erro === 'chave') {
          try { localStorage.removeItem(KEY); } catch (e) { /* sem armazenamento */ }
          portao('Chave incorreta. Tente novamente.');
          return;
        }
        bad(new Error(j.erro || 'Erro no servidor'));
      })
      .catch(() => bad(new Error('Sem conexão com a planilha. Tente de novo.')));
  }

  window.google = { script: { get run() {
    let ok = () => {}, bad = () => {};
    const p = new Proxy({}, { get(_, k) {
      if (k === 'withSuccessHandler') return (f) => { ok = f; return p; };
      if (k === 'withFailureHandler') return (f) => { bad = f; return p; };
      return (...args) => chama(k, args, ok, bad);
    } });
    return p;
  } } };

  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
<script>
window.addEventListener('error', (e) => { const v = document.querySelector('#view'); if (v && !DB) v.innerHTML = '<div class="tag empty">Erro ao abrir: ' + String(e.message).replace(/</g, '&lt;') + '</div>'; });
const ESTADO_CATS = ['frutas', 'legumes', 'padaria', 'carnes'];
const NAV = [['inicio', '🏠', 'Início'], ['lista', '📝', 'Lista'], ['precos', '🏷️', 'Preços'], ['despensa', '🗄️', 'Despensa'], ['desejos', '🎁', 'Wishlist'], ['compras', '🧾', 'Compras'], ['catalogo', '🗂️', 'Categorias']];
const st = { view: 'inicio', cat: '', q: '', comprei: true, store: '', cupom: '', busy: false };
let DB = null, CATS = {}, STORES = {}, P = [], O = [], L = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = (v) => { const s = String(v).trim(); return parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); };
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const daysAgo = (iso) => Math.max(0, Math.round((today() - new Date(String(iso).slice(0, 10) + 'T12:00:00')) / 864e5));
const ago = (d) => (d === 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`);
const fmtData = (iso) => String(iso).slice(8, 10) + '/' + String(iso).slice(5, 7) + '/' + String(iso).slice(0, 4);
const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
const P_ = (id) => P.find((x) => x.id === id);
const cc = (p) => CATS[p.cat] || { c: '#8E8E93', n: 'Outros', e: '📦' };
const unit = (o) => o.price / o.size;
const uLabel = (o, p) => `${brl(unit(o))}/${p.unit}`;
const yes = (v) => v === true || v === 'TRUE' || v === 'true';

function build() {
  CATS = {};
  DB.categorias.slice().sort((a, b) => a.ordem - b.ordem).forEach((c) => { CATS[c.id] = { n: c.nome, e: c.emoji, c: c.cor, d: c.descricao, x: c.exemplos, t: c.dica }; });
  STORES = {};
  DB.lojas.forEach((s) => { STORES[s.id] = { n: s.nome, e: s.emoji }; });
  if (!STORES[st.store]) st.store = DB.lojas.length ? DB.lojas[0].id : '';
  O = DB.precos.map((o) => ({ id: o.id, p: o.versao, s: o.loja, ago: daysAgo(o.data), date: o.data, price: Number(o.preco), size: Number(o.tamanho), qty: Number(o.quantidade) || 1, b: yes(o.comprei), c: o.compra, t: o.texto, n: o.nota, ok: yes(o.confirmado), item: o.item }));
  P = DB.versoes.map((v) => {
    const prod = DB.produtos.find((x) => x.id === v.produto) || {};
    const ev = DB.eventos.filter((e) => e.versao === v.id).sort((a, b) => String(a.data).localeCompare(String(b.data)));
    const starts = [], dur = [];
    ev.forEach((e) => {
      if (e.tipo === 'abri') starts.push(e.data);
      if (e.tipo === 'acabou' && starts.length) { const d = daysAgo(starts.shift()) - daysAgo(e.data); if (d > 0) dur.push(d); }
    });
    const dias = [...new Set(O.filter((o) => o.p === v.id && o.b).map((o) => o.date))].sort();
    const gaps = dias.slice(1).map((d, i) => daysAgo(dias[i]) - daysAgo(d));
    const ritmo = gaps.length >= 2 ? gaps.slice().sort((a, b) => a - b)[Math.floor(gaps.length / 2)] : null;
    const marcas = [...new Set(DB.itens.filter((i) => i.versao === v.id && i.marca).map((i) => i.marca))];
    return { id: v.id, name: prod.nome + (v.nome ? ' · ' + v.nome : ''), prod: prod.id, cat: prod.categoria, unit: prod.unidade || 'un', e: v.emoji || (CATS[prod.categoria] || {}).e || '📦', lv: Number(v.nivel) || 0, open: starts.length ? daysAgo(starts[0]) : null, dur, brand: marcas.join(', '), modo: v.modo || (ESTADO_CATS.indexOf(prod.categoria) >= 0 ? 'estado' : 'contagem'), fech: Number(v.fechadas) || 0, abert: Number(v.abertas) || 0, min: Number(v.minimo) || 0, ritmo, lastBuy: dias.length ? daysAgo(dias[dias.length - 1]) : null };
  }).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  L = DB.lista.map((l) => ({ id: l.id, p: l.versao, q: Number(l.quantidade) || 1, done: l.status === 'carrinho' })).filter((l) => P_(l.p));
}

function latest(pid) {
  const m = {};
  O.filter((o) => o.p === pid).sort((a, b) => a.ago - b.ago).forEach((o) => { if (!m[o.s]) m[o.s] = o; });
  return Object.values(m).sort((a, b) => unit(a) - unit(b));
}
const best = (pid) => latest(pid)[0];
function cover(p) {
  const a = avg(p.dur);
  if (a == null) return null;
  const aberto = p.abert > 0 && p.open != null ? Math.max(a - p.open, 0) + (p.abert - 1) * a : p.abert * a;
  return Math.round(aberto + p.fech * a);
}
function reason(p) {
  if (p.modo === 'livre') return '';
  const atrasado = p.ritmo && p.lastBuy >= p.ritmo;
  const msg = `Você costuma recomprar a cada ${p.ritmo} dias`;
  if (p.modo === 'estado') return p.lv === 3 ? 'Acabou' : p.lv === 2 ? 'Tá acabando' : atrasado ? msg : '';
  const total = p.fech + p.abert;
  if (!total) return p.lastBuy != null ? 'Acabou' : '';
  if (p.min && total < p.min) return `Abaixo do mínimo de ${p.min}`;
  const c = cover(p);
  if (c != null) return c <= 7 ? `Estoque para ~${c} dias` : '';
  return atrasado ? msg : '';
}
function suggestions() { return P.filter((p) => !L.some((l) => l.p === p.id) && reason(p)); }
function changes() {
  const r = [];
  P.forEach((p) => Object.keys(STORES).forEach((s) => {
    const h = O.filter((o) => o.p === p.id && o.s === s).sort((a, b) => a.ago - b.ago);
    if (h.length > 1 && h[0].ago !== h[1].ago) { const pct = (unit(h[0]) / unit(h[1]) - 1) * 100; if (Math.abs(pct) >= 3) r.push({ p, s, pct, h }); }
  }));
  return r.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
}
function byStore() {
  const m = {};
  L.filter((l) => !l.done).forEach((l) => { const b = best(l.p), k = b ? b.s : 'x'; (m[k] = m[k] || []).push({ l, b }); });
  return m;
}
function saving() {
  return L.filter((l) => !l.done).reduce((t, l) => {
    const a = latest(l.p);
    return a.length > 1 ? t + (unit(a[a.length - 1]) - unit(a[0])) * a[0].size * l.q : t;
  }, 0);
}
function monthRows() { const d = new Date().getDate(); return O.filter((o) => o.b && o.ago < d); }
const storeOf = (s) => STORES[s] || { n: 'Sem preço', e: '❔' };
const sumItems = (it) => it.reduce((t, x) => t + (x.b ? x.b.price * x.l.q : 0), 0);

}

    const it = O.filter((o) => o.c === c.id);
    return `<div class="row"><div class="em">${storeOf(c.loja).e}</div><div class="main"><b>${esc(storeOf(c.loja).n)}</b><small>${fmtData(c.data)} · ${it.map((o) => esc((P_(o.p) || {}).name)).join(', ')}</small></div><div class="r"><b>${brl(it.reduce((t, o) => t + o.price * o.qty, 0))}</b>${it.some((o) => o.t) ? `<button class="link" data-cupom="${c.id}">Conferir nomes</button>` : ''}</div></div>`;
  }).join('') || '<div class="empty">Nenhuma compra ainda.</div>'}</section><section class="tag" style="align-self:start"><div class="sech"><h2>Por categoria</h2></div>${Object.entries(cat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="row"><div class="em" style="--c:${(CATS[c] || {}).c}">${(CATS[c] || {}).e}</div><div class="main"><b>${esc((CATS[c] || {}).n)}</b></div><div class="r"><b>${brl(v)}</b></div></div>`).join('') || '<div class="empty">Sem dados ainda.</div>'}</section></div>`;
}

function V_cupom() {
  const c = DB.compras.find((x) => x.id === st.cupom);
  if (!c) return V_compras();
  const it = O.filter((o) => o.c === c.id && o.t);
  return `<div class="head"><div><h1>Conferir cupom</h1><div class="sub">${esc(storeOf(c.loja).n)} · ${fmtData(c.data)} · ${brl(it.reduce((t, o) => t + o.price * o.qty, 0))}</div></div><button class="btn" data-go="compras">Voltar</button></div><p class="sub" style="margin:-8px 0 12px">Use “·” para separar produto e versão. Ex.: Macarrão · Ninho</p><section class="tag" style="max-width:640px">${it.map((o) => `<div class="cup"><div class="orig">${esc(o.t)}</div><div class="cuprow"><input id="cup-${o.id}" value="${esc(st['d' + o.id] != null ? st['d' + o.id] : (P_(o.p) || {}).name)}" aria-label="Nome de ${esc(o.t)}"><button class="btn" data-save="${o.id}">Salvar</button></div><div class="cupnote"><span>${o.ok ? '<span class="stamp">Confirmado</span> ' : ''}${esc(o.n)}</span><span>${brl(o.price)}</span></div></div>`).join('')}</section>`;
}

function V_catalogo() {
  return `<div class="head"><div><h1>Categorias</h1><div class="sub">O que entra em cada uma. A lista cresce conforme você compra.</div></div></div><div class="grid g2">${Object.entries(CATS).map(([k, c]) => {
    const n = P.filter((p) => p.cat === k).length;
    return `<article class="tag"><div class="ph"><div class="em" style="--c:${c.c}">${c.e}</div><div class="main"><b>${esc(c.n)}</b><small>${n} ${n === 1 ? 'produto' : 'produtos'}</small></div></div>${c.d ? `<p class="catd">${esc(c.d)}</p>` : ''}${c.x ? `<p class="cate"><b>Exemplos:</b> ${esc(c.x)}</p>` : ''}${c.t ? `<p class="cate"><b>Dica:</b> ${esc(c.t)}</p>` : ''}</article>`;
  }).join('')}</div>
  <section class="tag sec"><div class="sech"><h2>Nova categoria</h2></div><form class="f" id="fcat"><div class="two"><label>Nome<input id="cn" required></label><label>Emoji<input id="ce" placeholder="📦"></label></div><label>O que entra<input id="cd"></label><button class="btn fill" style="min-height:44px">Criar categoria</button></form></section>
  <section class="tag sec"><div class="sech"><h2>Lojas</h2></div>${Object.values(STORES).map((s) => `<div class="row"><div class="em">${s.e}</div><div class="main"><b>${esc(s.n)}</b></div></div>`).join('')}<form class="f" id="floja" style="margin-top:10px"><div class="two"><label>Nome<input id="ln" required></label><label>Emoji<input id="le" placeholder="🏪"></label></div><button class="btn fill" style="min-height:44px">Adicionar loja</button></form></section>`;
}

function V_lancar() {
  const cats = Object.entries(CATS).map(([k, c]) => `<option value="${k}">${c.e} ${esc(c.n)}</option>`).join('');
  return `<div class="head"><div><h1>Lançar</h1><div class="sub">Comprou ou só viu o preço? Os dois alimentam o comparador.</div></div></div>
  <section class="tag" style="max-width:560px"><div class="chips"><button class="chip ${st.comprei ? 'on' : ''}" data-mode="1">🛍️ Comprei</button><button class="chip ${!st.comprei ? 'on' : ''}" data-mode="0">👀 Só vi o preço</button></div>
  <form class="f" id="form"><label>Produto<input id="fp" list="prods" required placeholder="Ex.: Lava-roupa · Roupas" autocomplete="off"></label>
  <div id="novo" class="two" hidden><label>Categoria<select id="fc">${cats}</select></label><label>Unidade<select id="fu"><option value="un">Unidade</option><option value="kg">Quilo</option><option value="L">Litro</option></select></label></div>
  <label>Marca (opcional)<input id="fm" autocomplete="off"></label>
  <div><div style="font-size:13px;color:var(--muted);margin-bottom:5px">Onde</div><div class="chips" style="margin:0">${Object.entries(STORES).map(([k, s]) => `<button type="button" class="chip ${st.store === k ? 'on' : ''}" data-store="${k}">${s.e} ${esc(s.n)}</button>`).join('')}</div></div>
  <div class="two"><label>Preço de cada (R$)<input id="fv" inputmode="decimal" required placeholder="21,50"></label><label><span id="fsl">Tamanho (L, kg ou un)</span><input id="fs" inputmode="decimal" required placeholder="2"></label></div>${st.comprei ? '<label>Quantas embalagens<input id="fq" inputmode="numeric" value="1"></label>' : ''}
  <button class="btn fill" id="fsave" style="min-height:46px">Registrar</button></form></section>`;
}

const VIEWS = { inicio: V_inicio, lista: V_lista, precos: V_precos, despensa: V_despensa, compras: V_compras, catalogo: V_catalogo, cupom: V_cupom, lancar: V_lancar, desejos: V_desejos };

function render() {
  if (!DB) return;
  $('#nav').innerHTML = NAV.map(([k, e, n]) => { const c = k === 'lista' ? L.filter((l) => !l.done).length : 0; return `<button class="nav ${st.view === k || (st.view === 'cupom' && k === 'compras') ? 'on' : ''}" data-go="${k}" title="${n}"><span>${e}</span><span class="lbl">${n}</span>${c ? `<span class="n">${c}</span>` : ''}</button>`; }).join('');
  $('#view').innerHTML = VIEWS[st.view]();
  $('#prods').innerHTML = P.map((p) => `<option value="${esc(p.name)}">`).join('');
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2800); }
const CACHE = 'inventario-v2';
function store() { try { localStorage.setItem(CACHE, JSON.stringify(DB)); } catch (e) { /* cache opcional */ } }
function setDB(d) { DB = typeof d === 'string' ? JSON.parse(d) : d; store(); build(); }
function repaint() { const a = document.activeElement; if (!(a && /INPUT|SELECT/.test(a.tagName))) render(); }

const fila = [];
let rodando = false, recarregar = false;
const uid = () => 'c' + Math.random().toString(36).slice(2, 9).padEnd(7, '0');
function marcaSync() { $('#sync').hidden = !(rodando || fila.length); }
function proximo() {
  marcaSync();
  if (rodando || !fila.length) { if (!rodando && recarregar) { recarregar = false; load(); } return; }
  rodando = true; marcaSync();
  const job = fila.shift();
  const timer = setTimeout(() => toast('O Google está demorando para responder. Sua alteração continua na fila.'), 25000);
  google.script.run
    .withSuccessHandler((d) => {
      clearTimeout(timer); rodando = false;
      if (typeof d === 'string') { setDB(d); if (fila.length) recarregar = true; if (!job.opt.done) repaint(); } else store();
      if (job.opt.done) job.opt.done();
      proximo();
    })
    .withFailureHandler((e) => {
      clearTimeout(timer); rodando = false; fila.length = 0;
      toast(e.message || 'Não foi possível salvar'); if (job.opt.fail) job.opt.fail();
      marcaSync(); load();
    })
    [job.fn](...job.args);
}
function call(fn, args, opt) {
  opt = opt || {};
  if (opt.local) { opt.local(); build(); render(); store(); }
  fila.push({ fn, args, opt });
  proximo();
}
function load() {
  google.script.run.withSuccessHandler((d) => { if (rodando || fila.length) { recarregar = true; return; } setDB(d); repaint(); }).withFailureHandler((e) => { if (!DB) $('#view').innerHTML = `<div class="tag empty">Não consegui abrir a planilha: ${esc(e.message)}</div>`; })[`getAll`]();
}
window.addEventListener('beforeunload', (e) => { if (rodando || fila.length) { e.preventDefault(); e.returnValue = ''; } });
const LOJAS = { amazon: 'Amazon', shopee: 'Shopee', mercadolivre: 'Mercado Livre', mercadolibre: 'Mercado Livre', magazineluiza: 'Magalu', magalu: 'Magalu', kabum: 'KaBuM', aliexpress: 'AliExpress', shein: 'Shein', americanas: 'Americanas', casasbahia: 'Casas Bahia', pontofrio: 'Ponto', carrefour: 'Carrefour', extra: 'Extra', netshoes: 'Netshoes', centauro: 'Centauro', temu: 'Temu' };
function dadosDaUrl(u) {
  try {
    const x = new URL(u), host = x.hostname.replace(/^(www|produto|m|pt)\./, ''), k = Object.keys(LOJAS).find((c) => host.includes(c));
    const segs = x.pathname.split('/').filter(Boolean), dp = segs.indexOf('dp');
    let s = dp > 0 ? segs[dp - 1] : (segs.slice().sort((a, b) => b.length - a.length)[0] || '');
    s = decodeURIComponent(s).replace(/-i\.\d+\.\d+$/, '').replace(/^MLB-?\d+-/i, '').replace(/-_JM$/i, '');
    const nome = /-/.test(s) && s.length > 8 ? s.replace(/-+/g, ' ').trim() : '';
    return { loja: k ? LOJAS[k] : host, nome: nome ? nome[0].toUpperCase() + nome.slice(1) : '' };
  } catch (e) { return {}; }
}
function preencher(el) {
  const u = el.value.trim();
  if (!/^https?:\/\//i.test(u)) return;
  const box = el.closest('.dlrow,.flink');
  if (box.dataset.url === u) return;
  box.dataset.url = u;
  const loja = box.querySelector('.ll,[name=loja]'), preco = box.querySelector('.lp,[name=preco]'), hint = box.querySelector('.hint'), nomeEl = box.classList.contains('dlrow') ? $('#dn') : null, d = dadosDaUrl(u);
  if (loja && !loja.value) loja.value = d.loja || '';
  if (nomeEl && !nomeEl.value && d.nome) nomeEl.value = d.nome;
  hint.textContent = 'Buscando nome e preço…';
  google.script.run.withSuccessHandler((r) => {
    if (!box.isConnected) return;
    r = r || {};
    if (nomeEl && r.nome && (!nomeEl.value || nomeEl.value === d.nome)) nomeEl.value = r.nome;
    if (preco && !preco.value && r.preco) preco.value = String(r.preco).replace('.', ',');
    hint.textContent = r.preco ? 'Preço encontrado. Confira antes de salvar.' : 'Esta loja não mostrou o preço. Preencha se quiser.';
  }).withFailureHandler(() => { if (box.isConnected) hint.textContent = 'Não consegui abrir o link. Preencha o preço se quiser.'; }).lerLink(u);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t || !DB) return;
  const d = t.dataset;
  if (d.go) { if (d.go === 'lancar') st.comprei = true; st.view = d.go; st.cat = ''; st.q = ''; $('#app').classList.remove('open'); render(); window.scrollTo(0, 0); }
  else if (d.cupom) { st.cupom = d.cupom; st.view = 'cupom'; render(); window.scrollTo(0, 0); }
  else if (d.add) { const nid = uid(); toast(`${P_(d.add).name} entrou na lista`); call('addLista', [d.add, 1, nid], { local: () => DB.lista.push({ id: nid, versao: d.add, quantidade: 1, status: 'pendente' }) }); }
  else if (t.id === 'addbtn') { const v = $('#addsel').value; if (v) { const nid = uid(); call('addLista', [v, 1, nid], { local: () => DB.lista.push({ id: nid, versao: v, quantidade: 1, status: 'pendente' }) }); } }
  else if (d.tog) { const l = DB.lista.find((x) => x.id === d.tog); if (!l) return; const feito = l.status !== 'carrinho'; call('marcarLista', [l.id, feito], { local: () => { l.status = feito ? 'carrinho' : 'pendente'; } }); }
  else if (d.clear) { call('limparCarrinho', [], { local: () => { DB.lista = DB.lista.filter((l) => l.status !== 'carrinho'); } }); }
  else if (d.cat !== undefined) { st.cat = d.cat; render(); }
  else if (d.lv) { const [id, i] = d.lv.split(':'); const n = +i; call('setNivel', [id, n], { local: () => { DB.versoes.find((v) => v.id === id).nivel = n; } }); }
  else if (d.est) { const [id, acao] = d.est.split(':'); const p = P_(id); if (acao === 'terminar' && p.open > 0) toast(`${p.name}: esta embalagem durou ${p.open} ${p.open === 1 ? 'dia' : 'dias'}`); call('estoque', [id, acao], { local: () => aplicaEstoque(id, acao) }); }
  else if (t.id === 'salvades') { salvarDesejo(); }
  else if (d.abrelink) { const p = t.nextElementSibling; p.hidden = !p.hidden; }
  else if (d.salvalink) { salvarLink(t.closest('.flink')); }
  else if (t.id === 'addlinkrow') { $('#dlinks').insertAdjacentHTML('beforeend', linkRow(true)); }
  else if (d.rmrow) { t.closest('.dlrow').remove(); }
  else if (d.status) { const [id, s] = d.status.split(':'); call('setDesejoStatus', [id, s], { local: () => { DB.desejos.find((x) => x.id === id).status = s; } }); }
  else if (d.dellink) { call('delLink', [d.dellink], { local: () => { DB.desejolinks = DB.desejolinks.filter((l) => l.id !== d.dellink); } }); }
  else if (d.deldes) { if (t.dataset.armed) { call('delDesejo', [d.deldes], { local: () => { DB.desejos = DB.desejos.filter((x) => x.id !== d.deldes); } }); } else { t.dataset.armed = '1'; t.textContent = 'Toque para confirmar'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Remover'; } }, 3000); } }
  else if (d.mode) { keep(() => { st.comprei = d.mode === '1'; }); }
  else if (d.store) { keep(() => { st.store = d.store; }); }
  else if (d.save) { const v = $('#cup-' + d.save).value.trim(); if (!v) return toast('Digite um nome'); t.textContent = 'Salvando…'; delete st['d' + d.save]; call('renomear', [d.save, v], { done: () => { render(); toast('Salvo. Da próxima vez, esse código já vem com o nome certo.'); } }); }
});
function hojeISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function aplicaEstoque(id, acao) {
  const v = DB.versoes.find((x) => x.id === id);
  const f = Number(v.fechadas) || 0, a = Number(v.abertas) || 0;
  if (acao === 'abrir' && f > 0) { v.fechadas = f - 1; v.abertas = a + 1; DB.eventos.push({ versao: id, data: hojeISO(), tipo: 'abri' }); }
  if (acao === 'terminar' && a > 0) { v.abertas = a - 1; DB.eventos.push({ versao: id, data: hojeISO(), tipo: 'acabou' }); }
  if (acao === 'mais') v.fechadas = f + 1;
  if (acao === 'menos' && f > 0) v.fechadas = f - 1;
}
function keep(fn) { const ids = ['fp', 'fv', 'fs', 'fm', 'fc', 'fu', 'fq'].filter((i) => $('#' + i)), v = ids.map((i) => $('#' + i).value), novo = $('#novo').hidden; fn(); render(); ids.forEach((i, n) => { if ($('#' + i)) $('#' + i).value = v[n]; }); $('#novo').hidden = novo; }
function atualizaNovo() { const v = $('#fp').value.trim(), p = P.find((x) => x.name.toLowerCase() === v.toLowerCase()); $('#novo').hidden = !v || !!p; $('#fsl').textContent = p ? `Tamanho (${p.unit})` : 'Tamanho (L, kg ou un)'; }
document.addEventListener('input', (e) => {
  if (e.target.matches && e.target.matches('.lu,[name=url]')) { const alvo = e.target; clearTimeout(alvo.t); alvo.t = setTimeout(() => preencher(alvo), 400); return; }
  if (e.target.id === 'q') { st.q = e.target.value; $('#cards').innerHTML = priceCards(); }
  else if (e.target.id === 'fp') atualizaNovo();
  else if (e.target.id.startsWith('cup-')) st['d' + e.target.id.slice(4)] = e.target.value;
});
function urlRuim(u) { return u && !/^https?:\/\//i.test(u); }
function salvarDesejo() {
  const id = uid(), nome = $('#dn').value.trim();
  if (!nome) return toast('Digite o nome do item');
  const brutos = [...document.querySelectorAll('.dlrow')].map((r) => ({ url: r.querySelector('.lu').value.trim(), loja: r.querySelector('.ll').value.trim(), preco: num(r.querySelector('.lp').value) || '' })).filter((l) => l.url);
  if (brutos.some((l) => urlRuim(l.url))) return toast('O link precisa começar com http:// ou https://');
  const links = brutos.map((l) => ({ id: uid(), url: l.url, loja: l.loja || (dadosDaUrl(l.url).loja || ''), preco: l.preco }));
  const novo = { id, nome, emoji: $('#de').value.trim() || '🎁', prioridade: $('#dp').value, nota: $('#dt').value.trim() };
  toast('Entrou na wishlist');
  call('addDesejo', [Object.assign({ links }, novo)], { local: () => { DB.desejos.push(Object.assign({ status: 'de olho', criado: hojeISO() }, novo)); links.forEach((l) => DB.desejolinks.push(Object.assign({ desejo: id, atualizado: hojeISO() }, l))); } });
}
function salvarLink(box) {
  const url = box.querySelector('[name=url]').value.trim();
  if (!url || urlRuim(url)) return toast('Cole um link começando com http:// ou https://');
  const link = { id: uid(), url, loja: box.querySelector('[name=loja]').value.trim() || (dadosDaUrl(url).loja || ''), preco: num(box.querySelector('[name=preco]').value) || '' };
  toast('Link salvo');
  call('addLink', [box.dataset.id, link], { local: () => DB.desejolinks.push(Object.assign({ desejo: box.dataset.id, atualizado: hojeISO() }, link)) });
}
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.lp) { const v = num(e.target.value), lid = e.target.dataset.lp; call('setLinkPreco', [lid, v > 0 ? v : ''], { local: () => { DB.desejolinks.find((l) => l.id === lid).preco = v > 0 ? v : ''; }}); return; }
  const id = e.target.dataset && e.target.dataset.modo;
  if (id) call('setModo', [id, e.target.value], { local: () => { const v = DB.versoes.find((x) => x.id === id); v.modo = e.target.value; v.nivel = 0; } });
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'fcat') { call('addCategoria', [{ nome: $('#cn').value.trim(), emoji: $('#ce').value.trim(), descricao: $('#cd').value.trim() }], { done: () => { render(); toast('Categoria criada'); } }); return; }
  if (e.target.id === 'floja') { call('addLoja', [{ nome: $('#ln').value.trim(), emoji: $('#le').value.trim() }], { done: () => { render(); toast('Loja adicionada'); } }); return; }
  const nome = $('#fp').value.trim(), preco = num($('#fv').value), tamanho = num($('#fs').value);
  if (!nome || !(preco > 0) || !(tamanho > 0)) return toast('Confira preço e tamanho');
  if (!st.store) return toast('Cadastre uma loja em Categorias');
  const btn = $('#fsave'); btn.disabled = true; btn.textContent = 'Salvando…';
  const novo = !$('#novo').hidden, loja = st.store, quantidade = $('#fq') ? Math.max(parseInt($('#fq').value, 10) || 1, 1) : 1;
  call('lancar', [{ nome, preco, tamanho, marca: $('#fm').value.trim(), loja, quantidade, comprei: st.comprei, categoria: novo ? $('#fc').value : '', unidade: novo ? $('#fu').value : '' }], {
    done: () => { render(); const p = P.find((x) => x.name.toLowerCase() === nome.toLowerCase()) || P.find((x) => x.name.toLowerCase().startsWith(nome.toLowerCase())); const b = p && best(p.id); toast(!b || b.s === loja ? 'Registrado. É o melhor preço anotado.' : `Registrado. Ainda é mais barato em ${storeOf(b.s).n}, ${uLabel(b, p)}`); },
    fail: () => { btn.disabled = false; btn.textContent = 'Registrar'; },
  });
});
$('#collapse').onclick = () => { $('#app').classList.toggle('mini'); const m = $('#app').classList.contains('mini'); $('#collapse').querySelector('span').textContent = m ? '⇥' : '⇤'; $('#collapse').setAttribute('aria-label', m ? 'Expandir menu' : 'Recolher menu'); };
$('#burger').onclick = () => $('#app').classList.add('open');
$('#scrim').onclick = () => $('#app').classList.remove('open');
try { const c = localStorage.getItem(CACHE); if (c) { DB = JSON.parse(c); build(); render(); } } catch (e) { DB = null; }
load();
</script>
